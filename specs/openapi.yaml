      x-client-apps:
        - mobile
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            Непрозрачный курсор следующей порции из поля next_cursor предыдущего
            ответа. При изменении scope, фильтров, поиска или сортировки курсор
            необходимо сбросить. Невалидный либо не соответствующий параметрам
            выборки курсор возвращает 400.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/PageSize"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - active
              - completed
        - name: date_from
          in: query
          required: false
          description: >-
            Нижняя граница периода истории включительно. Применяется при
            scope=completed; обе границы периода необязательны.
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: >-
            Верхняя граница периода истории включительно. Применяется при
            scope=completed и не может быть раньше date_from.
          schema:
            type: string
            format: date
        - name: search
          in: query
          required: false
          description: >-
            Регистронезависимый текстовый поиск в истории по адресу, названию
            подразделения и названию вида работ. Применяется при scope=completed.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: customer_ids
          in: query
          required: false
          description: >-
            Фильтр истории по одному или нескольким заказчикам. Значения
            объединяются по ИЛИ; пустой список означает отсутствие ограничения.
            Применяется при scope=completed.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          required: false
          description: Для active разрешен planned_start_asc; для completed по умолчанию actual_end_desc.
          schema:
            type: string
            enum:
              - planned_start_asc
              - planned_start_desc
              - actual_end_desc
