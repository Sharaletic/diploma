openapi: 3.1.0
info:
  title: Командор Аутсорсинг API
  version: 5.0.0
  description: >-
    API платформы «Командор Аутсорсинг» для веб-приложения, мобильного
    приложения и интеграций. Назначение каждой операции для клиентских
    приложений указано в x-client-apps; доменные tags от назначения клиента
    не зависят.
x-client-applications:
  mobile:
    description: Мобильное приложение исполнителя.
  web:
    description: Веб-кабинеты пользователей платформы.
  integration:
    description: Внешние системы, инфраструктурные проверки и сервисные интеграции.
servers:
  - url: /api/v1
    description: Относительный URL API
tags:
  - name: Аутентификация
    description: Операции доменной группы «Аутентификация».
  - name: Профиль
    description: Операции доменной группы «Профиль».
  - name: Пользователи и роли
    description: Операции доменной группы «Пользователи и роли».
  - name: Организации и подразделения
    description: Операции доменной группы «Организации и подразделения».
  - name: Справочники
    description: Операции доменной группы «Справочники».
  - name: Исполнители
    description: Операции доменной группы «Исполнители».
  - name: Заявки
    description: Операции доменной группы «Заявки».
  - name: Биржа смен
    description: Операции доменной группы «Биржа смен».
  - name: Табелирование
    description: Операции доменной группы «Табелирование».
  - name: Тарифы и расчеты
    description: Операции доменной группы «Тарифы и расчеты».
  - name: Акты сверки
    description: Операции доменной группы «Акты сверки».
  - name: Счета
    description: Операции доменной группы «Счета».
  - name: Чаты
    description: Операции доменной группы «Чаты».
  - name: Уведомления
    description: Операции доменной группы «Уведомления».
  - name: Настройки уведомлений
    description: Операции доменной группы «Настройки уведомлений».
  - name: Отчеты
    description: Операции доменной группы «Отчеты».
  - name: Договоры
    description: Операции доменной группы «Договоры».
  - name: Зоны ответственности
    description: Операции доменной группы «Зоны ответственности».
  - name: Графики работы
    description: Операции доменной группы «Графики работы».
  - name: Файлы
    description: Операции доменной группы «Файлы».
  - name: Интеграции
    description: Операции доменной группы «Интеграции».
  - name: Бизнес-аудит
    description: Операции доменной группы «Бизнес-аудит».
  - name: Система
    description: Операции доменной группы «Система».
paths:
  /acts:
    get:
      tags:
        - Акты сверки
      summary: "[WEB] Получить список актов сверки"
      operationId: get_acts
      x-client-apps:
        - web
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: period_from
          in: query
          schema:
            type: string
            format: date
        - name: period_to
          in: query
          schema:
            type: string
            format: date
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActStatus"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationActsPage"
        "400":
          $ref: "#/components/responses/MobileOtpWrongCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: &id001
        - US-0801
        - US-0802
        - US-0803
        - US-0804
        - US-0805
        - US-0806
      x-contract-status: derived
  /acts/generate:
    post:
      tags:
        - Акты сверки
      summary: "[WEB] Сформировать проект акта сверки с аутсорсером за период"
      operationId: post_acts_generate
      x-client-apps:
        - web
      parameters: []
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "201":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAct"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateActRequest"
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}:
    get:
      tags:
        - Акты сверки
      summary: "[WEB] Получить акт сверки"
      operationId: get_acts_id
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/confirm:
    post:
      tags:
        - Акты сверки
      summary: "[WEB] Подтвердить акт"
      operationId: post_acts_id_confirm
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAct"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/correction-requests:
    post:
      tags:
        - Акты сверки
      summary: "[WEB] Запросить корректировку акта"
      operationId: post_acts_id_correction_requests
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "201":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActCorrectionRequestResource"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActCorrectionRequest"
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/history:
    get:
      tags:
        - Акты сверки
      summary: "[WEB] Получить историю акта"
      operationId: get_acts_id_history
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/invoices:
    post:
      tags:
        - Счета
      summary: "[WEB] Сформировать счет по акту"
      operationId: post_acts_id_invoices
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "201":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/items:
    get:
      tags:
        - Акты сверки
      summary: "[WEB] Получить строки акта"
      operationId: get_acts_id_items
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/pdf:
    get:
      tags:
        - Акты сверки
      summary: "[WEB] Скачать текущую PDF-версию акта"
      operationId: get_acts_id_pdf
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF акта сверки
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/send:
    post:
      tags:
        - Акты сверки
      summary: "[WEB] Отправить акт аутсорсеру на согласование"
      operationId: post_acts_id_send
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationAct"
      security:
        - bearerAuth: []
      x-source-refs: *id001
      x-contract-status: derived
  /acts/{id}/zup-exports:
    get:
      tags:
        - Интеграции
      summary: "[WEB] Получить историю выгрузок в 1С ЗУП"
      operationId: get_acts_id_zup_exports
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZupExportPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: &id038
        - integration requirements
      x-contract-status: tbd
  /audit-events:
    get:
      tags:
        - Бизнес-аудит
      summary: "[WEB] Получить журнал бизнес-аудита с применением фильтров"
      operationId: get_audit_events
      x-client-apps:
        - web
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: occurred_from
          in: query
          schema:
            type: string
            format: date-time
        - name: occurred_to
          in: query
          schema:
            type: string
            format: date-time
        - name: category
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: &id002
        - US-1304
      x-contract-status: derived
  /audit-events/{id}:
    get:
      tags:
        - Бизнес-аудит
      summary: "[WEB] Получить событие аудита"
      operationId: get_audit_events_id
      x-client-apps:
        - web
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      x-source-refs: *id002
      x-contract-status: derived
  /auth/2fa/challenges/{challenge_id}/resend:
    post:
      tags:
        - Аутентификация
      summary: "[WEB] Повторно отправить email-код второго фактора"
      operationId: post_auth_2fa_challenge_resend
      x-client-apps:
        - web
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Создан новый одноразовый challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Повторная отправка пока недоступна или challenge заблокирован
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      x-contract-status: implemented
  /auth/2fa/verify:
    post:
      tags:
        - Аутентификация
      summary: "[WEB] Подтвердить второй фактор и завершить вход"
      operationId: post_auth_2fa_verify
      x-client-apps:
        - web
      parameters: []
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
          headers:
            Set-Cookie:
              description: Refresh-токен в защищенной httpOnly cookie при завершенном входе.
              schema:
                type: string
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verify2FARequest"
      x-source-refs: &id003
        - Epic-01
        - backend/auth
      x-contract-status: implemented
  /auth/login:
    post:
      tags:
        - Аутентификация
      summary: "[WEB] Войти по логину и паролю или получить запрос второго фактора"
      operationId: post_auth_login
      x-client-apps:
        - web
      parameters: []
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              description: Refresh-токен в защищенной httpOnly cookie при завершенном входе.
              schema:
                type: string
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      x-source-refs: *id003
      x-contract-status: derived
      x-komandor-status: implemented
  /auth/logout:
    post:
      tags:
        - Аутентификация
      summary: "[WEB] Завершить текущую сессию"
      operationId: post_auth_logout
      x-client-apps:
        - web
      parameters: []
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "204":
          description: Операция выполнена
      security:
        - bearerAuth: []
      x-source-refs: *id003
      x-contract-status: derived
  /auth/password/reset:
    post:
      tags:
        - Аутентификация
      summary: "[WEB] Установить новый пароль по коду"
      operationId: post_auth_password_reset
      x-client-apps:
        - web
      parameters: []
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "204":
          description: Операция выполнена
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      x-source-refs: &id041
