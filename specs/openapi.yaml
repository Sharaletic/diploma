    MobileOtpChallenge:
      type: object
      description: |
        Серверное состояние OTP mobile delivery challenge. `expires_at` относится к сроку
        действия кода, а `resend_available_at` — к моменту, после которого
        можно запросить новый код; это независимые deadlines.
      properties:
        challenge_id:
          type: string
          format: uuid
        sent_at:
          type: string
          format: date-time
          description: Время принятия сервером решения об отправке SMS.
        expires_at:
          type: string
          format: date-time
          description: Время окончания срока действия отправленного SMS-кода.
        resend_available_at:
          type: string
          format: date-time
          description: Серверное время, начиная с которого разрешена повторная отправка.
        server_time:
          type: string
          format: date-time
          description: Время сервера при формировании ответа для коррекции клиентского отсчёта.
      required:
        - challenge_id
        - sent_at
        - expires_at
        - resend_available_at
        - server_time
    MobileOtpRateLimitError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            details:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  enum:
                    - otp_resend_too_early
                    - otp_attempts_exceeded
                retry_after_seconds:
                  type: integer
                  minimum: 1
                resend_available_at:
                  type: string
                  format: date-time
                  description: Присутствует для `otp_resend_too_early`.
                blocked_until:
                  type: string
                  format: date-time
                  description: Присутствует для `otp_attempts_exceeded`.
                server_time:
                  type: string
                  format: date-time
              required:
                - code
                - retry_after_seconds
                - server_time
          required:
            - details
    MobileOtpWrongCodeError:
      allOf:
