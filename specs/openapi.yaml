components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh-токен в защищенной httpOnly cookie.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недостаточно прав или объект вне доступного скоупа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Объект не найден в доступном скоупе
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт бизнес-состояния или идемпотентности
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Запрос не прошёл валидацию
      headers:
        X-Request-ID:
          description: Идентификатор запроса для диагностики
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            message: Некорректные данные запроса
            details:
              errors:
                - location:
                    - body
                    - contact_email
                  message: value is not a valid email address
                  type: value_error
    MobileOtpRateLimited:
      description: |
        Повторная отправка пока недоступна либо номер временно заблокирован
        после неверных попыток ввода OTP. `Retry-After` содержит число
        секунд до ближайшей разрешённой попытки; окончательное решение всегда
        принимает сервер.
      headers:
        Retry-After:
          description: Число секунд до ближайшей разрешённой попытки.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MobileOtpRateLimitError"
    MobileOtpWrongCode:
      description: Введён неверный одноразовый код.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MobileOtpWrongCodeError"
  schemas:
    UserSort:
      type: string
      enum:
        - email
        - name
        - created_at
      title: UserSort
    UserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
            - type: string
            - type: "null"
          title: Email
        phone:
          anyOf:
            - type: string
            - type: "null"
          title: Phone
        first_name:
          anyOf:
            - type: string
            - type: "null"
          title: First Name
        last_name:
